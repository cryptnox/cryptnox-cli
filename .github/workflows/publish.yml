name: Publish to PyPI

on:
  push:
    tags: ["ver[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point to a commit on main - not publishing" >&2
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the build tools
        run: pip install --require-hashes -r publish-requirements.txt

      - name: Build
        run: python -m build --no-isolation

      - name: Check tag matches package version
        run: |
          version="${GITHUB_REF_NAME#ver}"
          if [ ! -f "dist/cryptnox_cli-${version}-py3-none-any.whl" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the package version; built:" >&2
            ls dist >&2
            exit 1
          fi

      - name: Check the package metadata
        run: twine check --strict dist/*

      - name: Install system dependencies for pyscard
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swig libpcsclite-dev

      - name: Install the wheel and run the CLI
        run: |
          python -m venv ../check
          ../check/bin/pip install dist/*.whl
          ../check/bin/cryptnox --version | grep -Fx "Cryptnox CLI ${GITHUB_REF_NAME#ver}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cryptnox-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

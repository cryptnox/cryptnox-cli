name: Build and deploy documentation
permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# One deploy at a time: concurrent pushes to gh-pages reject the later one. A newer
# push to a pull request replaces its running build.
concurrency:
  group: ${{ github.event_name == 'push' && 'docs-deploy' || format('docs-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2  # the PR merge commit and its parents, for the diff below

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Sphinx and dependencies
        run: pip install sphinx sphinx-rtd-theme sphinx-sitemap cairosvg pillow

      - name: Generate Sphinx docs
        run: sphinx-build -b html docs docs/_build/html

      # The PDF builds on every deploy; on a pull request only when its inputs change:
      # docs/ and the docstrings of cryptnox_cli/ (autodoc). A failing diff fails the step.
      - name: Decide whether the PDF is built
        id: pdf
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(docs/|cryptnox_cli/|LICENSE$|\.github/workflows/docs\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No change to the PDF inputs in this pull request, PDF build skipped."
          fi

      - name: Install LaTeX for PDF
        if: steps.pdf.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra tex-gyre

      - name: Build PDF (pdflatex)
        if: steps.pdf.outputs.build == 'true'
        run: |
          sphinx-build -M latexpdf docs docs/_build
          cp docs/_build/latex/cryptnox-cli.pdf docs/_build/html/cryptnox-cli.pdf

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
          allow_empty_commit: false
          keep_files: false
          force_orphan: false
          enable_jekyll: false

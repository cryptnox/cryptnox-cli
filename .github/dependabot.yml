version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eth-abi requires parsimonious<0.11
      - dependency-name: "parsimonious"
        versions: [">=0.11"]
      # eth-keyfile requires pycryptodome<4
      - dependency-name: "pycryptodome"
        versions: [">=4"]
